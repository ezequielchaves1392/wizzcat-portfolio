<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizzcat - Cargando...</title>
    <style>
        body {
            background-color: #0b0710;
            background-image: url('img/background-magic.jpeg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: pointer;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 7, 16, 0.75);
            z-index: 1;
        }

        .wizzcat-container {
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            z-index: 2;
            animation: fadeInContainer 1.5s ease-out forwards;
            transition: transform 3s cubic-bezier(0.16, 1, 0.3, 1), opacity 3s ease-in;
        }

        .wizzcat-logo {
            width: 130px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            animation: floatCat 3s ease-in-out infinite alternate;
        }

        .wizzcat-text {
            font-family: 'Georgia', serif;
            font-size: 4rem;
            color: #facc15;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateX(20px);
            animation: slideInText 1s ease-out 0.8s forwards;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
        }

        .magic-particle {
            position: absolute;
            pointer-events: none;
            background: radial-gradient(circle, rgba(250, 204, 21, 0.9) 0%, rgba(168, 85, 247, 0.4) 70%, rgba(168, 85, 247, 0) 100%);
            border-radius: 50%;
            animation: particleFade 0.8s linear forwards;
            z-index: 10;
        }

        @keyframes fadeInContainer {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes floatCat {
            0% { transform: translateY(0px); box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
            100% { transform: translateY(-10px); box-shadow: 0 0 35px rgba(168, 85, 247, 0.8); }
        }

        @keyframes slideInText {
            0% { opacity: 0; transform: translateX(20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes particleFade {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="wizzcat-container" id="wizzcat-box">
        <img src="img/logo-icon.png" alt="Wizzcat Logo" class="wizzcat-logo">
        <div class="wizzcat-text">Wizzcat</div>
    </div>

    <audio id="magic-sound">
        <!-- Ruta restaurada a musica/ -->
        <source src="musica/sonido-magico.wav" type="audio/wav">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <script>
        if (sessionStorage.getItem('splashVisto')) {
            window.location.replace("home.html");
        } else {
            sessionStorage.setItem('splashVisto', 'true');
        }

        const audio = document.getElementById('magic-sound');
        const container = document.getElementById('wizzcat-box');

        function irAlIndex() {
            window.location.href = "home.html";
        }

        let redirigiendo = false;

        document.addEventListener('mousemove', (e) => {
            if (redirigiendo) return;
            createParticle(e.pageX, e.pageY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('magic-particle');
            
            const size = Math.random() * 12 + 4;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            particle.style.left = `${x - size/2}px`;
            particle.style.top = `${y - size/2}px`;
            
            const tx = (Math.random() - 0.5) * 80;
            const ty = (Math.random() - 0.5) * 80;
            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);

            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 800);
        }

        document.body.addEventListener("click", () => {
            if (redirigiendo) return;
            redirigiendo = true;

            audio.currentTime = 0;
            audio.play();

            // Corte de seguridad para frenar el audio a los 2.5s y evitar maullidos sobrantes
            setTimeout(() => {
                audio.pause();
                audio.currentTime = 0;
            }, 2500);

            setTimeout(() => {
                container.style.animation = 'none'; 
                container.style.transform = 'scale(1)';
                container.style.opacity = '1';

                setTimeout(() => {
                    container.style.transform = 'scale(4)';
                    container.style.opacity = '0';
                }, 50);

            }, 500); 

            setTimeout(irAlIndex, 3500); 
        });
    </script>

</body>
</html>
